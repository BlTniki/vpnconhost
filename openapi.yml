openapi: 3.0.0
info:
  title: VPN Peer Management API
  version: 1.0.0
  description: API for managing WireGuard VPN peers
paths:
  /peers/{peer_id}:
    get:
      tags: ["Peers"]
      summary: Получить информацию о пире по ID
      parameters:
        - name: peer_id
          in: path
          required: true
          schema:
            type: string
          description: Уникальный идентификатор пира
      responses:
        200:
          description: Информация о пире успешно получена
          content:
            application/json:
              schema:
                type: object
                properties:
                  peer:
                    type: object
                    properties:
                      peer_id:
                        type: string
                        description: Уникальный идентификатор пира
                      peer_ip:
                        type: string
                        description: IP-адрес пира
                      peer_public_key:
                        type: string
                        description: Публичный ключ пира
                      peer_private_key:
                        type: string
                        description: Приватный ключ пира
                      is_activated:
                        type: boolean
                        description: Статус активации пира
        404:
          description: Пир не найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Not Found"
                  message:
                    type: string
                    example: "Peer with id=peer123 not found"
    delete:
      tags: ["Peers"]
      summary: Удалить пира по ID
      parameters:
        - name: peer_id
          in: path
          required: true
          schema:
            type: string
          description: Уникальный идентификатор пира
      responses:
        200:
          description: Пир успешно удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Peer deleted successfully"
                  peer_id:
                    type: string
                    example: "peer123"

  /peers/sync:
    post:
      tags: ["Peers"]
      summary: Синхронизировать всех пиров из БД в WireGuard
      description: Добавляет всех активированных пиров из базы данных в WireGuard конфигурацию
      responses:
        200:
          description: Все пиры успешно синхронизированы
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "All peers synced to WireGuard successfully"

  /peers:
    post:
      tags: ["Peers"]
      summary: Создать нового пира
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - peer_id
                - peer_ip
              properties:
                peer_id:
                  type: string
                  description: Уникальный идентификатор пира
                peer_ip:
                  type: string
                  description: IP-адрес пира
                is_activated:
                  type: boolean
                  description: Статус активации пира (по умолчанию false)
                  default: false
      responses:
        201:
          description: Пир успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Peer created successfully"
                  peer:
                    type: object
                    properties:
                      peer_id:
                        type: string
                        description: Уникальный идентификатор пира
                      peer_ip:
                        type: string
                        description: IP-адрес пира
                      peer_public_key:
                        type: string
                        description: Публичный ключ пира
                      peer_private_key:
                        type: string
                        description: Приватный ключ пира
                      is_activated:
                        type: boolean
                        description: Статус активации пира
        400:
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Validation Failed"
                  message:
                    type: string
                    example: "Fields peer_id and peer_ip are required"

  /peers/{peer_id}/activate:
    post:
      tags: ["Peers"]
      summary: Активировать пира
      parameters:
        - name: peer_id
          in: path
          required: true
          schema:
            type: string
          description: Уникальный идентификатор пира
      responses:
        200:
          description: Пир успешно активирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Peer activated successfully"
                  peer_id:
                    type: string
                    example: "peer123"
                  is_activated:
                    type: boolean
                    example: true

  /peers/{peer_id}/deactivate:
    post:
      tags: ["Peers"]
      summary: Деактивировать пира
      parameters:
        - name: peer_id
          in: path
          required: true
          schema:
            type: string
          description: Уникальный идентификатор пира
      responses:
        200:
          description: Пир успешно деактивирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Peer deactivated successfully"
                  peer_id:
                    type: string
                    example: "peer123"
                  is_activated:
                    type: boolean
                    example: false

  /peers/{peer_id}/download:
    get:
      tags: ["Peers"]
      summary: Скачать конфигурацию пира
      description: Возвращает конфигурационный файл WireGuard для пира
      parameters:
        - name: peer_id
          in: path
          required: true
          schema:
            type: string
          description: Уникальный идентификатор пира
      responses:
        200:
          description: Конфигурация пира успешно получена
          content:
            text/plain:
              schema:
                type: string
                example: |
                  [Interface]
                  PrivateKey = ...
                  Address = ...
                  
                  [Peer]
                  PublicKey = ...
                  Endpoint = ...
          headers:
            Content-Disposition:
              schema:
                type: string
                example: "attachment; filename=peer123.conf"
        404:
          description: Конфигурация пира не найдена
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Not Found"
                  message:
                    type: string
                    example: "Configuration for peer with id=peer123 not found"